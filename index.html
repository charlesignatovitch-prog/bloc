<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site bloqué</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #24162f;
    --texte: #f1e7d0;
    --or: #c8a04a;
    --discret: #a999b8;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fond);
    color: var(--texte);
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    padding-top: max(2rem, env(safe-area-inset-top, 0px));
    padding-bottom: max(2rem, env(safe-area-inset-bottom, 0px));
  }
  main {
    width: 100%;
    max-width: 44rem;
    text-align: center;
  }
  .filet {
    width: 3.5rem;
    height: 1px;
    background: var(--or);
    margin: 0 auto 2.5rem;
  }
  blockquote {
    margin: 0;
    font-size: clamp(1.7rem, 4.6vw, 2.9rem);
    line-height: 1.3;
    font-weight: 500;
    font-style: italic;
    text-wrap: balance;
    transition: opacity .35s ease;
  }
  blockquote.cache { opacity: 0; }
  .auteur {
    margin: 2rem 0 0;
    font-size: 1.25rem;
    color: var(--or);
    font-weight: 600;
    transition: opacity .35s ease;
  }
  .auteur small {
    display: block;
    margin-top: .2rem;
    font-size: 1rem;
    font-weight: 500;
    color: var(--discret);
  }
  .auteur.cache { opacity: 0; }
  button {
    margin-top: 3rem;
    background: transparent;
    color: var(--texte);
    border: 1px solid var(--or);
    border-radius: 2px;
    padding: .7rem 1.6rem;
    font: inherit;
    font-size: 1.1rem;
    cursor: pointer;
  }
  button:hover { background: rgba(200, 160, 74, .15); }
  button:focus-visible { outline: 2px solid var(--or); outline-offset: 3px; }
  .note {
    margin: 2.5rem 0 0;
    font-size: 1.05rem;
    color: var(--discret);
  }
  @media (prefers-reduced-motion: reduce) {
    blockquote, .auteur { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="filet" aria-hidden="true"></div>
  <blockquote id="citation" aria-live="polite"></blockquote>
  <p class="auteur" id="auteur"></p>
  <button id="autre" type="button">Une autre citation</button>
  <p class="note">Ce site est bloqué. Respirez, puis reprenez ce que vous aviez à faire.</p>
</main>

<script>
  var CITATIONS = [
    { t: "Notre cœur est sans repos tant qu’il ne repose pas en toi.", a: "Saint Augustin", s: "Les Confessions" },
    { t: "N’ayez pas peur !", a: "Saint Jean-Paul II", s: "Homélie d’inauguration, 22 octobre 1978" },
    { t: "Tout le malheur des hommes vient d’une seule chose, qui est de ne savoir pas demeurer en repos dans une chambre.", a: "Blaise Pascal", s: "Pensées" },
    { t: "Je veux passer mon ciel à faire du bien sur la terre.", a: "Sainte Thérèse de Lisieux", s: "Propos rapportés" },
    { t: "Ce que nous faisons n’est qu’une goutte d’eau dans la mer, mais la mer serait moindre s’il lui manquait cette goutte.", a: "Mère Teresa", s: "" },
    { t: "Là où est ton trésor, là aussi sera ton cœur.", a: "Évangile selon saint Matthieu", s: "Mt 6, 21" },
    { t: "Mettez à profit le temps présent.", a: "Lettre de saint Paul aux Éphésiens", s: "Ep 5, 16" },
    { t: "Le temps est supérieur à l’espace.", a: "Pape François", s: "Evangelii gaudium, n° 222" },
    { t: "La liberté ne consiste pas à faire ce que l’on veut, mais à avoir le droit de faire ce que l’on doit.", a: "Saint Jean-Paul II", s: "Homélie de Baltimore, 1995" },
    { t: "Tous naissent comme des originaux, mais beaucoup meurent comme des photocopies.", a: "Attribué à saint Carlo Acutis", s: "" },
    { t: "Veillez et priez, afin de ne pas entrer en tentation.", a: "Évangile selon saint Matthieu", s: "Mt 26, 41" },
    { t: "Ne vous mettez pas en souci du lendemain : demain aura soin de lui-même.", a: "Évangile selon saint Matthieu", s: "Mt 6, 34" },
    { t: "Tout ce que nous avons à décider, c’est ce que nous ferons du temps qui nous est imparti.", a: "Gandalf", s: "J. R. R. Tolkien, La Communauté de l’Anneau" }
  ];

  var elCitation = document.getElementById("citation");
  var elAuteur = document.getElementById("auteur");
  var bouton = document.getElementById("autre");
  var dernier = -1;

  function afficher(premiere) {
    var i;
    do { i = Math.floor(Math.random() * CITATIONS.length); } while (i === dernier && CITATIONS.length > 1);
    dernier = i;
    var c = CITATIONS[i];

    function ecrire() {
      elCitation.textContent = "« " + c.t + " »";
      elAuteur.textContent = c.a;
      if (c.s) {
        var petit = document.createElement("small");
        petit.textContent = c.s;
        elAuteur.appendChild(petit);
      }
      elCitation.classList.remove("cache");
      elAuteur.classList.remove("cache");
    }

    if (premiere) { ecrire(); return; }
    elCitation.classList.add("cache");
    elAuteur.classList.add("cache");
    setTimeout(ecrire, 350);
  }

  bouton.addEventListener("click", function () { afficher(false); });
  afficher(true);
</script>
</body>
</html>
