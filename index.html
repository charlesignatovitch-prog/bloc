<title>Site bloqué</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #24162f;
    --texte: #f1e7d0;
    --or: #c8a04a;
    --discret: #a999b8;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fond);
    color: var(--texte);
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    padding-top: max(2rem, env(safe-area-inset-top, 0px));
    padding-bottom: max(2rem, env(safe-area-inset-bottom, 0px));
  }
  main {
    width: 100%;
    max-width: 44rem;
    text-align: center;
  }
  .filet {
    width: 3.5rem;
    height: 1px;
    background: var(--or);
    margin: 0 auto 2.5rem;
  }
  blockquote {
    margin: 0;
    font-size: clamp(1.7rem, 4.6vw, 2.9rem);
    line-height: 1.3;
    font-weight: 500;
    font-style: italic;
    text-wrap: balance;
    transition: opacity .35s ease;
  }
  blockquote.cache { opacity: 0; }
  .auteur {
    margin: 2rem 0 0;
    font-size: 1.25rem;
    color: var(--or);
    font-weight: 600;
    transition: opacity .35s ease;
  }
  .auteur small {
    display: block;
    margin-top: .2rem;
    font-size: 1rem;
    font-weight: 500;
    color: var(--discret);
  }
  .auteur.cache { opacity: 0; }
  button {
    margin-top: 3rem;
    background: transparent;
    color: var(--texte);
    border: 1px solid var(--or);
    border-radius: 2px;
    padding: .7rem 1.6rem;
    font: inherit;
    font-size: 1.1rem;
    cursor: pointer;
  }
  button:hover { background: rgba(200, 160, 74, .15); }
  button:focus-visible { outline: 2px solid var(--or); outline-offset: 3px; }
  .note {
    margin: 2.5rem 0 0;
    font-size: 1.05rem;
    color: var(--discret);
  }
  @media (prefers-reduced-motion: reduce) {
    blockquote, .auteur { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="filet" aria-hidden="true"></div>
  <blockquote id="citation" aria-live="polite"></blockquote>
  <p class="auteur" id="auteur"></p>
  <button id="autre" type="button">Une autre citation</button>
  <p class="note">Ce site est bloqué. Respirez, puis reprenez ce que vous aviez à faire.</p>
</main>

var POOL = [];
  CITATIONS.forEach(function (c, i) {
    var poids = c.p || 1;
    for (var k = 0; k < poids; k++) POOL.push(i);
  });
  var elCitation = document.getElementById("citation");
  var elAuteur = document.getElementById("auteur");
  var bouton = document.getElementById("autre");
  var dernier = -1;

  function afficher(premiere) {
    var i;
    do { i = POOL[Math.floor(Math.random() * POOL.length)]; } while (i === dernier && CITATIONS.length > 1);
    dernier = i;
    var c = CITATIONS[i];

    function ecrire() {
      elCitation.textContent = "« " + c.t + " »";
      elAuteur.textContent = c.a;
      if (c.s) {
        var petit = document.createElement("small");
        petit.textContent = c.s;
        elAuteur.appendChild(petit);
      }
      elCitation.classList.remove("cache");
      elAuteur.classList.remove("cache");
    }

    if (premiere) { ecrire(); return; }
    elCitation.classList.add("cache");
    elAuteur.classList.add("cache");
    setTimeout(ecrire, 350);
  }

  bouton.addEventListener("click", function () { afficher(false); });
  afficher(true);
</script>
